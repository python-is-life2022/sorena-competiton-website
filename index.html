<!doctype html>
  <html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مسابقه سورنا</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
        <button id="langToggle" type="button" aria-label="تغییر زبان به انگلیسی">English</button>
        <a
          id="downloadCallButton"
          class="download-call-button"
          href="assets/sorena-call-2026.pdf"
          download="Sorena Painting Competition Call.pdf"
          data-i18n="cta.download"
          aria-label="دانلود فایل فراخوان"
        ></a>
        <div class="hero">
          <img src="assets/ChatGPT Image Sep 9, 2026, 09_53_04 AM.png" alt="" class="small-icon">
          <img src="assets/sorena-hero-img.png" alt="" class="butterfly-img">
          <img src="assets/ChatGPT Image Sep 7, 2026, 06_26_26 PM (1).png" alt="" class="big-img">
          <img src="assets/ChatGPT Image Sep 9, 2026, 09_53_04 AM.png" alt="" class="big-icon">
          <p class="p-title" data-i18n="hero.eyebrow"></p>
          <h1 class="hero-h1" data-i18n="hero.title"></h1>
          <p class="hero-description" data-i18n="hero.description"></p>
          <a href="mailto:sorena@abasabadecopark.com?subject=مسابقه نقاشی سورنا" data-email-subject class="send-button-link">
            <button class="send-button" type="button" data-i18n="cta.send"></button>
          </a>
        </div>
        <section class="middle">
          <div class="middle-img">
            <img src="assets/one art one story.png" alt="one art one story">
          </div>
          <div class="middle-text">
            <h2 class="middle-h2" data-i18n="about.title"></h2>
            <p class="middle-p" data-i18n="about.text"></p>
          </div>
          <div class="middle-left-images">
              <img src="assets/sticker6.png" alt="" class="left-img1">
              <img src="assets/sticker7.png" alt="" class="left-img2">
          </div>
          <div class="frame">
                <img src="assets/draw picture.png" alt="">
                <h2 data-i18n="topic.title"></h2>
                <p data-i18n="topic.intro"></p>

                <button class="topics-toggle" type="button" aria-expanded="false" aria-controls="topicLists">
                  <span data-i18n="topic.toggle">نمایش دسته‌بندی‌ها</span>
                  <span class="topics-toggle-icon" aria-hidden="true">⌄</span>
                </button>

                <div class="item-lists" id="topicLists" hidden>
                  <ul class="list1">
                    <li data-i18n="topics.1"></li><li data-i18n="topics.2"></li><li data-i18n="topics.3"></li><li data-i18n="topics.4"></li><li data-i18n="topics.5"></li>
                  </ul>
                  <ul class="list2">
                    <li data-i18n="topics.6"></li><li data-i18n="topics.7"></li><li data-i18n="topics.8"></li><li data-i18n="topics.9"></li><li data-i18n="topics.10"></li>
                  </ul>
                  <ul class="list3">
                    <li data-i18n="topics.11"></li><li data-i18n="topics.12"></li><li data-i18n="topics.13"></li>
                  </ul>
                  <ul class="list4">
                    <li data-i18n="topics.web"></li>
                  </ul>
                </div>
                
          </div>
        </section>
      <br><br>
        <section class="topics">
              <div class="box1">
                <h2 class="h2-one" data-i18n="participation.title"></h2>
                <img src="assets/Frame 2.png" alt="Frame">
                <h2 class="h2-second" data-i18n="participation.national"></h2>
                <p class="p-one" data-i18n="participation.nationalText"></p>
                <h2 class="h2-third" data-i18n="participation.international"></h2>
                <p class="p-second" data-i18n="participation.internationalText"></p>
                <p class="p-third" data-i18n="participation.note"></p>
              </div>
              <div class="box2">
                <img src="assets/pallet-paint.jpg" alt="">
                <h2 class="h2-one" data-i18n="tech.title"></h2>
                <h2 class="h2-second" data-i18n="tech.free"></h2>
                <p data-i18n="tech.text"></p>
              </div>
              <div class="box3">
                <h2 class="h2-one" data-i18n="age.title"></h2>
                <div class="age-group">
                  <img src="assets/ChatGPT Image Sep 7, 2026, 09_04_03 PM 1.png" alt="" class="img1">
                  <h2 class="h2-second" data-i18n="age.child"></h2><p class="age-range" data-i18n="age.6to9"></p>
                </div>
                <div class="age-group">
                  <img src="assets/young10 to 12.png" alt="" class="img2">
                  <h2 class="h2-third" data-i18n="age.child"></h2><p class="age-range" data-i18n="age.10to12"></p>
                </div>
                <div class="age-group">
                  <img src="assets/young 13 to 18.png" alt="" class="img3">
                  <h2 class="h2-fourth" data-i18n="age.teen"></h2><p class="age-range" data-i18n="age.13to18"></p>
                </div>
              </div>
        </section>
        <section>
          <div class="rules">
            <h2 data-i18n="rules.title"></h2>
            <img src="assets/tree draw.png" alt="">
            <ul class="rules-list1">
              <li data-i18n="rules.1"></li><li data-i18n="rules.2"></li><li data-i18n="rules.4"></li><li data-i18n="rules.5"></li>
            </ul>

            <ul class="rules-list2">
              <li data-i18n="rules.6"></li><li data-i18n="rules.7"></li><li data-i18n="rules.8"></li><li data-i18n="rules.9"></li><li data-i18n="rules.10"></li>
            </ul>
          </div>
        </section>
        <div class="part3">
        <div class="information">
          <h2 class="info-header">
            <span data-i18n="submission.infoTitle"></span>
          </h2>
          <ul class="info-list">
            <li data-i18n="submission.1"></li><li data-i18n="submission.2"></li><li data-i18n="submission.3"></li><li data-i18n="submission.4"></li><li data-i18n="submission.5"></li><li data-i18n="submission.6"></li><li data-i18n="submission.7"></li>
          </ul>
        </div>
        <img src="assets/sticker6 (1).png" alt="" class="part3-sticker1">
        <img src="assets/sticker7 (1).png" alt="" class="part3-sticker2">
        <div class="bg-mail">
            <h2 class="mail-header">
              <span data-i18n="mail.title"></span>
            </h2>
          <div class="mail-list-box">
            <ul class="mail-list">
              <li data-i18n="mail.1"></li>
              <li class="mail-link-item"><a href="mailto:sorena@abasabadecopark.com?subject=مسابقه نقاشی سورنا" data-email-subject class="mail-link">sorena@abasabadecopark.com</a></li>
              <li data-i18n="mail.2"></li>
              <li data-i18n="mail.deadline"></li>
              <img src="assets/sticer-8-buttom.png" alt="">
            </ul>
          </div>
          </div> 
        </div>
        <section class="footer">
          <div class="judgement">
            <img src="assets/ChatGPT Image Sep 9, 2026, 09_08_56 PM 1.png" alt="" class="judge-sticker">
            <h2 class="judge-header" data-i18n="judging.title"></h2>
            <ul class="judge-list">
              <li data-i18n="judging.1"></li><li data-i18n="judging.2"></li><li data-i18n="judging.3"></li>
            </ul>
          </div>
          <div class="why-sorena">
            <img src="assets/ChatGPT Image Sep 12, 2026, 07_58_57 PM.png" alt="" class="old-sorena">
            <h2 class="why-sorena-header">
              <span data-i18n="why.title"></span>
            </h2>
            <p class="sorena-description" data-i18n="why.subtitle"></p>
            <ul class="sorena-list">
              <li data-i18n="why.1"></li><li data-i18n="why.2"></li><li data-i18n="why.3"></li>
            </ul>
          </div>
        </section>
        <section class="creators">
          <div class="talebi">
            <h2 data-i18n="creator.uiux"></h2>
            <h3>Mohamad Talebi</h3>
          </div>
          <a class="creator-portfolio kharazi" href="https://amirmostafakharazi.com" target="_blank" rel="noopener noreferrer">
            <h2 data-i18n="creator.developer"></h2>
            <h3>Amir Kharazi</h3>
          </a>
        </section>
    <script src="script.js"></script>
  </body>
  </html>
